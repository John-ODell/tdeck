; The T-Deck's USB companion dongle: keyboard, mouse, mesh terminal and shared drive for
; the computer. Plug it in; the T-Deck talks to it over ESP-NOW (src/link/link_proto.h in
; this repo, included directly, so there is no copy to keep in step).
;
; Build from this folder: `pio run -e geek`. The images for a release come from
; tools/geekrelease.sh (or scripts/build_release.sh at the repo root, which builds both halves).
;
; This started as firmware/tdeck-dongle in John-ODell/ESP-Geek (main at 2808d40, 2026-10-26)
; and was brought here with the GEEK board support (lib/Geek) so the public repo builds on
; its own. TFT_eSPI comes from ../lib, the same copy the T-Deck uses.
[platformio]
default_envs = geek

[dongle]
platform = espressif32@6.3.0
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; No ARDUINO_USB_CDC_ON_BOOT: with it the core starts USB before setup(), too early for
; the dongle's own USB name and product id. setup() starts the CDC port itself (geek_usb.h).
lib_extra_dirs = lib, ../lib
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I../src/link

; Waveshare ESP32-S3-GEEK: 16 MB flash, TinyUSB (USB_MODE=0) instead of the hardware
; CDC/JTAG so the board can be a keyboard and a disk, Arduino on core 1, WiFi on core 0.
; -DGEEK_LCD and -DGEEK_SD turn on the screen (link status, last keys) and the TF card
; as a shared drive. USER_SETUP_LOADED makes the -DTFT_* flags TFT_eSPI's whole setup.
[env:geek]
extends = dongle
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${dongle.build_flags}
    -DGEEK_LCD
    -DGEEK_SD
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=40000000
    -DDISABLE_ALL_LIBRARY_WARNINGS

; Generic ESP32-S3 boards: keyboard, mouse and mesh terminal, no screen, no drive.
; Without GEEK_LCD and GEEK_SD the Geek library's screen and card parts compile to nothing.
[env:s3]
extends = dongle
board = esp32-s3-devkitc-1
lib_ignore = TFT_eSPI, SD_MMC
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${dongle.build_flags}
    -DLED_RGB_PIN=48

; Generic ESP32-S2 boards (S2 Mini, Saola, ...). The S2 only has TinyUSB.
[env:s2]
extends = dongle
board = esp32-s2-saola-1
lib_ignore = TFT_eSPI, SD_MMC
build_flags =
    ${dongle.build_flags}
    -DLED_PIN=15
