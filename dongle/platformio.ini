; USB keyboard/mouse dongle for the T-Deck Keyboard app (ESP32-S3 or ESP32-S2).
; Plug it into the computer; the T-Deck talks to it over ESP-NOW (see ../src/link/link_proto.h).
[platformio]
default_envs = s3

[dongle]
platform = espressif32@6.3.0
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -I../src/link

; Generic ESP32-S3 boards. TinyUSB (USB_MODE=0) instead of the hardware CDC/JTAG,
; otherwise the board can't be a keyboard.
[env:s3]
extends = dongle
board = esp32-s3-devkitc-1
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${dongle.build_flags}
    -DLED_RGB_PIN=48

;  Waveshare ESP32-S3-GEEK: USB-A plug, 1.14" 240x135 ST7789 for status, BOOT on GPIO0, no LED.
[env:geek]
extends = env:s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_extra_dirs = ../lib
build_flags =
    ${dongle.build_flags}
    -DGEEK_LCD
    -DGEEK_SD
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=40000000
    -DDISABLE_ALL_LIBRARY_WARNINGS

; Generic ESP32-S2 boards (S2 Mini, Saola, ...). The S2 only has TinyUSB.
[env:s2]
extends = dongle
board = esp32-s2-saola-1
build_flags =
    ${dongle.build_flags}
    -DLED_PIN=15
